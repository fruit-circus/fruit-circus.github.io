  #fruittree {
    position: absolute;

    }

    #peach {

    }
    #grape {

        width: 8%;

    }
    #starfruit {
        position: absolute;
        width: 9%;
        transform: translate(500%,120%);
        
    }

</style>


<img src="fruit_tree.png" id="fruittree" alt="fruit tree">

<a href="fiction.html">
<img src="peach.png" id="peach" onmouseover="fruitWidthOver(this)" onmouseout="fruitWidthOut(this)" alt="peach"/>

<a href="games.html">

<script>
    function fruitWidthOver(fruit) {
        fruit.style.border = "2px dashed black";
    }
    function fruitWidthOut(fruit) {
        fruit.style.border = "2px dashed transparent";
    }
</script>
