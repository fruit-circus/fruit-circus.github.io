<!DOCTYPE html>
<html>
<head>
  <title>Fruit Directory</title>
  <link rel="icon" type="image/x-icon" href="fruitcircusfavicon.ico?">
</head>
<style>
  
  #fruittree {
    position: absolute;
    width: 100%;
    }


    #blueberry,
    #blueberry2 {
        cursor: pointer;
        position: absolute;
        width: 4%;
        transform: translate(1100%,910%);
    }

    #peach,
    #peach2 {
        cursor: pointer;
        position: absolute;
        width: 9%;
        transform: translate(330%,330%);
    }
    #peach2,
    #starfruit2,
    #grape2,
    #blueberry2 {
        display: none;
    }
    #grape,
    #grape2 {
        cursor: pointer;
        position: absolute;
        width: 8%;
        transform: translate(730%,370%);
    }
    #starfruit,
    #starfruit2 {
        cursor: pointer;
        position: absolute;
        width: 9%;
        transform: translate(500%,120%);
    }
    .pointer {
        cursor: pointer;
    }
    #meek {
        z-index: 2;
        display: none;
        position: absolute;
        width: 100%;
        transform: translate(-16.5%,-3%);
    }
    #meek2 {
        z-index: 2;
        display: none;
        width: 100%;
        position: absolute;
        transform: translate(0%,0%);
    }
    #t,
    #t2 {
        position: absolute;
        width: 9%;
        transform: translate(380%,0%);
    }
    #c,
    #c2 {
        position: absolute;
        width: 10%;
        transform: translate(691%,0%);
    }

    #t2,
    #c2 {
        display: none;
    }

</style>


<img src="fruit_tree.png" onmouseover="allUnwiggle()" id="fruittree" alt="fruit tree">
<img src="the-t.png" id="t" alt="letter t" class="pointer" onmouseover="changeT()" onclick="activateMeek()">
<img src="the-c.png" id="c" alt="letter c" class="pointer" onmouseover="changeC()" onclick="activateMeek2()">

<img src="the-t2.png" id="t2" alt="letter t" class="pointer" onmouseout="revertT()" onclick="activateMeek()">
<img src="the-c2.png" id="c2" alt="letter c" class="pointer" onmouseout="revertC()" onclick="activateMeek2()">


<img src="peach.png" id="peach" onclick="fiction()" onmouseover="peachWiggle()" alt="peach"/>

<img src="blueberry.png" id="blueberry" onclick="zambia()" onmouseover="blueWiggle()" alt="blueberry"/>
<img src="blueberry2.png" id="blueberry2" onclick="zambia()" onmouseout="blueUnwiggle()" alt="blueberry"/>

<img src="peach2.png" id="peach2" onclick="fiction()" onmouseout="peachUnwiggle()" alt="peach"/>

<img src="starfruit.png" id="starfruit" onclick="games()" onmouseover="starWiggle()" alt="starfruit"/>


<img src="starfruit2.png" id="starfruit2" onclick="games()" onmouseout="starUnwiggle()" alt="starfruit"/>


<img src="grape.png" id="grape" onclick="poetry()" onmouseover="grapeWiggle()" alt="grape"/>


<img src="grape2.png" id="grape2" onclick="poetry()" onmouseout="grapeUnwiggle()" alt="grape"/>


<img src="meek.png" id="meek" alt="meekus"/>
<img src="meek2.png" id="meek2" alt="meekus"/>
<audio src="knock.mp3" id="knock"></audio>
<audio src="knock2.mp3" id="knock2"></audio>

        <audio id="pop"> <source src="squelch1.mp3" type="audio/mpeg"> </audio>
        <audio id="pop2"> <source src="squelch2.mp3" type="audio/mpeg"> </audio>
        <audio id="pop3"> <source src="squelch1.mp3" type="audio/mpeg"> </audio>

 
</div>
</body>
<script>
    function peachWiggle() {
        peach.style.display = "none";
        peach2.style.display = "block";
    }
    function peachUnwiggle() {
        peach.style.display = "block";
        peach2.style.display = "none";
    }


    function blueWiggle() {
        blueberry.style.display = "none";
        blueberry2.style.display = "block";
    }
    function blueUnwiggle() {
        blueberry.style.display = "block";
        blueberry2.style.display = "none";
    }

    function starWiggle() {
        starfruit.style.display = "none";
        starfruit2.style.display = "block";
    }
    function starUnwiggle() {
        starfruit.style.display = "block";
        starfruit2.style.display = "none";
    }

    function grapeWiggle() {
        grape.style.display = "none";
        grape2.style.display = "block";
    }
    function grapeUnwiggle() {
        grape.style.display = "block";
        grape2.style.display = "none";
    }

    var meekus = false;
    var meekus2 = false;

    function activateMeek() {
        if (!meekus) {
            knock.play();
            setTimeout(function() {
                meek.style.display = "block";
                setTimeout(function() {
                    meek.style.display = "none";
                    meekus = true;
                }, 1500);
            }, 700);
        } else {
            knock2.play();
        }
    }

    function activateMeek2() {
        if (!meekus2) {
            knock.play();
            setTimeout(function() {
                meek2.style.display = "block";
                setTimeout(function() {
                    meek2.style.display = "none";
                    meekus2 = true;
                }, 2700);
            }, 700);
        } else {
            knock2.play();
        }
    }

function changeT() {
    t.style.display = "none";
    t2.style.display = "block";
}
function changeC() {
    c.style.display = "none";
    c2.style.display = "block";
}

function revertT() {
    t2.style.display = "none";
    t.style.display = "block";
}
function revertC() {
    c2.style.display = "none";
    c.style.display = "block";
}

function poetry() {
    pop2.play();
    setTimeout(function() {window.open('fruit-directory/poetry.html', '_self');}, 500);
}

function zambia() {
    pop2.play();
    setTimeout(function() {window.open('fruit-directory/zambia.html', '_self');}, 500);
}

function games() {
    pop.play();
    setTimeout(function() {window.open('fruit-directory/games.html', '_self');}, 500);
}

function fiction() {
    pop.play();
    setTimeout(function() {window.open('fruit-directory/fiction.html', '_self');}, 500);
}

function allUnwiggle() {
    starUnwiggle();
    grapeUnwiggle();
    peachUnwiggle();
}

</script>
</html>
